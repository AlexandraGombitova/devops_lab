name: A workflow for my Hello World App
on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup network and MongoDB
        run: |
          docker network create --driver bridge se-methods
          docker pull mongo
          docker run -d --name mongo-dbserver --network se-methods mongo
          sleep 5

      - name: Package with Maven
        run: mvn package -DskipTests

      - name: Build Docker Image
        run: docker build -t devopsimage .

      - name: Run image
        run: docker run --network se-methods --name devopscontainer devopsimage